version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shopscale-v1-db
    environment:
      POSTGRES_DB: shopscale
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopscale"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    image: node:18-alpine
    container_name: shopscale-v1-app
    working_dir: /usr/src/app
    volumes:
      - ./:/usr/src/app
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/shopscale
    command: sh -c "npm install --silent && node server.js"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
