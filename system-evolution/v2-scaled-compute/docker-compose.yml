version: '3.8'

services:
  load-balancer:
    image: nginx:alpine
    container_name: shopscale-v2-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-01
      - app-02

  app-01:
    image: node:18-alpine
    container_name: shopscale-v2-app1
    working_dir: /usr/src/app
    volumes:
      - ./:/usr/src/app
    environment:
      PORT: 8080
      INSTANCE_NAME: app-instance-01
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/shopscale
      REDIS_URL: redis://redis:6379
    command: sh -c "npm install --silent && node server.js"
    depends_on:
      postgres:
        condition: service_healthy

  app-02:
    image: node:18-alpine
    container_name: shopscale-v2-app2
    working_dir: /usr/src/app
    volumes:
      - ./:/usr/src/app
    environment:
      PORT: 8080
      INSTANCE_NAME: app-instance-02
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/shopscale
      REDIS_URL: redis://redis:6379
    command: sh -c "npm install --silent && node server.js"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: shopscale-v2-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:15-alpine
    container_name: shopscale-v2-db
    environment:
      POSTGRES_DB: shopscale
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopscale"]
      interval: 5s
      timeout: 5s
      retries: 5
