version: '3.8'

services:
  app:
    image: node:18-alpine
    container_name: shopscale-v6-app
    working_dir: /usr/src/app
    volumes:
      - ./:/usr/src/app
    ports:
      - "8080:8080"
    command: node server.js

  prometheus:
    image: prom/prometheus:latest
    container_name: shopscale-v6-prom
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    container_name: shopscale-v6-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:latest
    container_name: shopscale-v6-toxiproxy
    ports:
      - "8474:8474"
